<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="HARU - Social Media Links">
  <title>HARU | Socials</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="noise"></div>

  <!-- Opening screen: tap/click starts music because browsers commonly block autoplay with sound -->
  <section id="intro" class="intro">
    <div class="intro-content">
      <div class="mini-dot"></div>
      <p class="intro-small">WELCOME TO</p>
      <h1>HARU<span>.</span></h1>
      <button id="enterBtn" class="enter-btn">ENTER <span>→</span></button>
      <p class="intro-hint">tap anywhere to enter</p>
    </div>
  </section>

  <main id="mainContent" class="page hidden">
    <header class="profile">
  <div class="avatar">
  <img src="./profile.jpg" alt="HARU profile picture">
</div>
      <p class="eyebrow">SOCIAL LINKS</p>
      <h1>HARU</h1>
      <p class="handle">@hoosrold</p>
      <div class="line"></div>
      <p class="bio">Find me around the internet.</p>
    </header>

    <section class="links" aria-label="Social media links">

      <a class="social-card" href="https://www.tiktok.com/@its_xiolong_bru" target="_blank" rel="noopener noreferrer">
        <span class="icon tiktok-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 3c.4 2.5 1.8 4.1 4.5 4.3v3.1c-1.7-.1-3.2-.6-4.5-1.5v6.4c0 4-2.8 5.8-6.1 5.8-3 0-5.4-2-5.4-5 0-3.2 2.7-5.5 6.2-5.2v3.2c-1.7-.2-3 .7-3 2 0 1.1.9 1.9 2.1 1.9 1.3 0 2.7-.7 2.7-2.8V3h3.5z"/></svg>
        </span>
        <span class="label"><strong>TikTok</strong><small>@its_xiolong_bru</small></span>
        <span class="arrow">↗</span>
      </a>

      <a class="social-card" href="https://www.instagram.com/hoosrold/" target="_blank" rel="noopener noreferrer">
        <span class="icon instagram-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle class="fill" cx="17.5" cy="6.5" r="1.2"/></svg>
        </span>
        <span class="label"><strong>Instagram</strong><small>@hoosrold</small></span>
        <span class="arrow">↗</span>
      </a>

      <a class="social-card" href="https://www.facebook.com/harukun272829/" target="_blank" rel="noopener noreferrer">
        <span class="icon facebook-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8h3V4.2c-.5-.1-1.9-.2-3.6-.2-3.6 0-6 2.2-6 6.1v3.4H4v4.2h3.4V24h4.2v-6.3H15l.5-4.2h-3.9v-3c0-1.2.3-2.5 2.4-2.5z"/></svg>
        </span>
        <span class="label"><strong>Facebook</strong><small>/harukun272829</small></span>
        <span class="arrow">↗</span>
      </a>

      <button class="social-card discord-card" id="discordBtn" type="button">
        <span class="icon discord-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 4.5A16 16 0 0 0 15.6 3l-.5 1.1a14.2 14.2 0 0 0-6.2 0L8.4 3a16 16 0 0 0-3.9 1.5C2 8.2 1.3 12 1.6 15.8a15.7 15.7 0 0 0 4.8 2.4l1.2-1.6c-.7-.2-1.4-.6-2-1 1.7.8 3.5 1.2 5.4 1.2s3.7-.4 5.4-1.2c-.6.4-1.3.8-2 1l1.2 1.6a15.7 15.7 0 0 0 4.8-2.4c.4-4.4-.7-8.1-3.9-11.3zM8.8 14.1c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2zm6.4 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2z"/></svg>
        </span>
        <span class="label"><strong>Discord</strong><small id="discordText">not_jhb</small></span>
        <span class="arrow">⧉</span>
      </button>

    </section>

    <footer>
      <span>© 2026 HARU</span>
      <button id="musicBtn" class="music-btn" type="button" aria-label="Toggle music">
        <span class="music-bars"><i></i><i></i><i></i><i></i></span>
        <span id="musicText">MUSIC ON</span>
      </button>
    </footer>
  </main>

  <audio id="bgMusic" loop preload="auto">
    <source src="music/bounce-back.mp3" type="audio/mpeg">
  </audio>

  <div id="toast" class="toast">Discord username copied</div>
  <script src="script.js"></script>
</body>
</html>
